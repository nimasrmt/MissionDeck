name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app tests
      - run: python -m pytest -q
  frontend-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require referenced frontend assets (known incomplete in initial snapshot)
        run: |
          test -f app/static/app.js
          test -f app/static/graph.js
          node --check app/static/app.js
          node --check app/static/graph.js
