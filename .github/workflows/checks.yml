name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app tests
      - run: python -m pytest -q
  frontend-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check frontend scripts
        run: |
          test -f app/static/app.js
          test -f app/static/graph.js
          node --check app/static/app.js
          node --check app/static/graph.js
          node --check app/static/monitor.js
  browser-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/missiondeck-browser" --no-save --package-lock=false playwright@1.62.1
          "$RUNNER_TEMP/missiondeck-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise frontend with isolated API fixtures
        run: NODE_PATH="$RUNNER_TEMP/missiondeck-browser/node_modules" node --test tests/browser_smoke.cjs
